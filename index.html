<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Care Jobs</title>
<meta name="theme-color" content="#b4532a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Care Jobs">
<style>
:root{
  --bg:#f6f8fc; --panel:#ffffff; --ink:#1f1f1f; --ink2:#5f6368; --line:#e3e6ea;
  --accent:#b4532a; --accent-soft:#fbeee7; --accent-ink:#8a3d1d;
  --red:#c5221f; --star:#e8a317; --hover:#f2f4f7; --sel:#fdf3ee;
  --font: Roboto, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-text-size-adjust:100%}
a{color:var(--accent-ink)}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:240px 1fr;grid-template-rows:64px 1fr;height:100vh;height:100dvh}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:8px 16px}
.brand{display:flex;align-items:center;gap:10px;width:216px;font-size:20px;color:var(--ink2);flex:none}
.brand svg{flex:none}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:8px;background:#eaf0f6;border-radius:24px;padding:0 16px;height:46px}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;outline:none;color:var(--ink)}
.search:focus-within{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.2)}
nav{padding:8px 8px 8px 0;overflow:auto}
nav button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:transparent;padding:0 12px 0 24px;height:34px;border-radius:0 17px 17px 0;color:var(--ink);text-align:left}
nav button:hover{background:var(--hover)}
nav button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:700}
nav .count{margin-left:auto;font-size:12px;font-weight:700}
nav svg{width:20px;height:20px;flex:none}
main{background:var(--panel);border-radius:16px 16px 0 0;margin-right:16px;overflow:auto;position:relative}
.bar{position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bar h1{font-size:16px;margin:0 12px 0 0;font-weight:500}
.status{font-size:12px;color:var(--ink2);width:100%}
.status b{color:var(--ink)}
select,.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px;color:var(--ink)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.row{display:grid;grid-template-columns:32px minmax(120px,200px) 1fr auto;gap:8px;align-items:center;padding:0 16px 0 8px;min-height:44px;border-bottom:1px solid var(--line);cursor:pointer;background:#f2f6fc}
.row.unread{background:var(--panel)}
.row:hover{box-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px rgba(60,64,67,.3);position:relative;z-index:1}
.row.unread .emp,.row.unread .ttl{font-weight:700;color:var(--ink)}
.row .emp,.row .ttl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink2)}
.row .ttl span{color:var(--ink2);font-weight:400}
.row .meta{font-size:12px;color:var(--ink2);white-space:nowrap;text-align:right}
.row.unread .meta{font-weight:700;color:var(--ink)}
.star{border:0;background:transparent;padding:4px;line-height:0;color:#b0b4b9}
.star.on{color:var(--star)}
.closing{color:var(--red);font-weight:700}
.detail{padding:16px 20px 20px 48px;border-bottom:1px solid var(--line);background:var(--panel)}
.detail h2{font-size:20px;font-weight:400;margin:0 0 4px}
.facts{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:12px 0;font-size:13px}
.facts dt{color:var(--ink2)}
.facts dd{margin:0}
.desc{color:var(--ink2);margin:8px 0 12px;max-width:760px}
.btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:18px;padding:9px 20px;background:var(--accent);color:#fff;text-decoration:none;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
textarea,input[type=text]{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--panel);color:var(--ink)}
textarea{min-height:80px;resize:vertical}
.notelabel{display:block;font-size:12px;color:var(--ink2);margin:14px 0 4px}
.flag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#fde8e7;color:var(--red);margin-left:6px;font-weight:500}
.warn{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#fdf0d5;color:#8a5a00;margin-left:6px;font-weight:500}
.warnbox{background:#fdf0d5;color:#6b4600;border-radius:8px;padding:8px 10px;max-width:760px}
.hiders{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:#eef1f4;color:var(--ink2);margin-left:6px;font-weight:500}
details.other{border-top:8px solid var(--bg)}
details.other>summary{padding:12px 16px;cursor:pointer;color:var(--ink2);font-weight:500;list-style:none}
details.other>summary::before{content:"▸ ";}
details.other[open]>summary::before{content:"▾ ";}
.empty{padding:40px 16px;color:var(--ink2);text-align:center}
.pad{padding:16px 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:6px 0;font-size:13px;color:var(--ink2)}
.card p b{color:var(--ink);font-weight:500}
.paybar{position:relative;height:22px;background:#eef1f4;border-radius:6px;margin:8px 0 2px}
.paybar .range{position:absolute;top:4px;bottom:4px;background:var(--accent);border-radius:4px;opacity:.85}
.paybar .nmw{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.paylabels{display:flex;justify-content:space-between;font-size:11px;color:var(--ink2)}
.q{padding:14px 20px;border-bottom:1px solid var(--line)}
.q label.opt{display:flex;gap:8px;align-items:center;padding:4px 0}
.q .qt{font-weight:500;margin-bottom:6px}
.match{margin:16px;border:1px solid var(--accent);border-radius:12px;background:var(--accent-soft);padding:14px}
.match ol{margin:8px 0 0;padding-left:20px}
.match li{margin-bottom:8px}
.site{padding:14px 20px;border-bottom:1px solid var(--line)}
.site h3{margin:0 0 4px;font-size:15px}
.site p{margin:4px 0;color:var(--ink2)}
.small{font-size:12px;color:var(--ink2)}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 60px}
  header{grid-column:1;padding:8px 16px}
  .brand{width:auto}
  .brand span{display:none}
  main{grid-row:2;grid-column:1;margin:0;border-radius:0}
  .bar select{flex:1 1 140px;min-width:0}
  nav{grid-row:3;grid-column:1;display:flex;padding:0;border-top:1px solid var(--line);background:var(--panel);overflow-x:auto;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1 1 0;flex-direction:column;justify-content:center;gap:2px;height:60px;padding:0 2px;border-radius:0;font-size:10.5px;min-width:0;text-align:center;line-height:1.15}
  nav .count{display:none}
  .row{grid-template-columns:32px minmax(0,1fr);grid-template-rows:auto auto auto;padding:8px 16px 8px 4px;gap:0 8px}
  .row .star{grid-row:1/4}
  .row .emp{grid-column:2;white-space:normal}
  .row .ttl{grid-column:2;white-space:normal}
  .row .meta{grid-column:2;text-align:left}
  .detail{padding:16px}
  .facts{grid-template-columns:1fr}
  .facts dt{margin-top:6px}
}
</style>
</head>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = new Date(); today.setHours(0,0,0,0);
const fmtDate = s => s ? new Date(s+"T00:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "not stated";
const daysLeft = s => s ? Math.round((new Date(s+"T00:00:00") - today)/864e5) : null;
const fmtSal = s => s ? String(s).replace(/£(\d{4,})(\.00)?/g, (m,n)=>"£"+(+n).toLocaleString("en-GB")).replace(/£(\d+)\.00\b/g,"£$1").replace(/ to /g," – ") : "";
const money = n => "£" + Math.round(n).toLocaleString("en-GB");

function annual(sal){
  const nums = (String(sal).replace(/,/g,"").match(/\d+(\.\d+)?/g) || []).map(Number);
  if (!nums.length) return null;
  const top = Math.max(...nums);
  if (top < 100) return top * 37.5 * 52.143;   // hourly
  if (top >= 5000) return top;                  // yearly
  return null;                                  // per shift / day / unclear
}
function contractOf(j){
  const t = (j.type||"").toLowerCase();
  if (t.includes("bank")) return "Bank";
  if (t.includes("fixed")) return "Fixed term";
  if (t.includes("locum")||t.includes("contract")) return "Contract";
  if (t.includes("permanent")) return "Permanent";
  return j.type || "not stated";
}
function ruleBreaks(j){
  const r = [];
  const text = (j.title+" "+(j.description||"")).toLowerCase();
  if (/\bbank\b/i.test(j.title) || /bank/i.test(j.type||"")) r.push("Bank");
  if (/\bnight/.test(j.title.toLowerCase())) r.push("Night shifts");
  if (needsCar(j)) r.push("Needs a car / driving");
  if (needsLevel3(j.title+" "+(j.description||""))) r.push("Asks for Level 3+ qualification");
  if (CHILD_TITLE_RE.test(j.title) || CHILD_TEXT_RE.test(j.description||"")) r.push("Children's work – needs experience with children");
  if (SENIOR_RE.test(j.title)) r.push("Senior or specialist role – usually needs higher qualifications or experience");
  else if (j.source==="NHS Jobs" && (() => { const n = (String(j.salary).replace(/,/g,"").match(/\d+(\.\d+)?/)||[])[0]; return n && +n >= 28392; })()) r.push("NHS Band 4 or above – usually needs Level 3");
  const yrs = yearsRequired(j); if (yrs >= 2) r.push(`Asks for at least ${yrs} years' experience in the role`);
  if (j.miles != null && j.miles > RADIUS) r.push(`Over ${RADIUS} miles`);
  return r;
}

function warnings(j){
  const w = [];
  const nf = j.source==="NHS Jobs" ? (nhsFlags[j.id]||[]) : [];
  if (nf.includes("licence")) w.push("Advert mentions a driving licence – check if it's needed");
  if (nf.includes("nvq")) w.push("Advert mentions NVQ – check which level");
  if (nf.includes("children") && !CHILD_TITLE_RE.test(j.title)) w.push("Advert mentions children – check the role");
  if (!w.length && HOMECARE_RE.test(j.title+" "+(j.description||""))) w.push("Home care – check if a car is needed");
  return w;
}

let feed = null, feedState = "loading", feedError = "";
function allJobs(){
  const live = feed?.jobs || SNAPSHOT?.jobs || [];
  const base = live.map(j => ({...j, source: j.source || "NHS Jobs"}));
  const hasReed = base.some(j => j.source === "Reed");
  const reedIds = new Set(base.map(j => j.id));
  return [...base, ...(hasReed ? [] : REED_STATIC.map(j => ({...j, static:true})).filter(j => !reedIds.has(j.id)))]
    .filter(j => RELEVANT.test(j.title) && !NOT_RELEVANT.test(j.title))
    .filter((j, i, arr) => { const k = (j.title+"|"+j.employer+"|"+(j.locations||[])[0]+"|"+j.salary).toLowerCase(); return arr.findIndex(x => (x.title+"|"+x.employer+"|"+(x.locations||[])[0]+"|"+x.salary).toLowerCase() === k) === i; })
    .filter(j => { const d = daysLeft(j.closeDate); return d === null || d >= 0; })
    .filter(j => !ruleBreaks(j).some(b => /driving|licence|car\b/i.test(b))) // she has no licence: never shown
    .filter(j => !hidden[j.id])
    .sort((a,b) => (b.postDate||"").localeCompare(a.postDate||""));
}
async function loadFeed(){
  feedState = "loading"; render();
  try{
    const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 25000);
    const r = await fetch(FEED_URL, {signal: ctrl.signal, cache:"no-store"});
    clearTimeout(t);
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || ("HTTP "+r.status));
    feed = d; feedState = "live";
    loadReedDetails();
    loadNhsFlags();
    try{ localStorage.setItem("cj_lastfeed", JSON.stringify(d)); }catch(e){}
  }catch(e){
    feedError = e.name === "AbortError" ? "timed out" : e.message;
    const last = store.get("lastfeed", null);
    if (last && (!SNAPSHOT || last.fetched > SNAPSHOT.fetched)) { feed = last; }
    feedState = "offline";
  }
  render();
}

let nhsFlags = store.get("nhsflags", {});
async function loadNhsFlags(){
  try{
    const r = await fetch(FEED_URL.replace(/\/jobs$/, "/nhs-flags"));
    if (!r.ok) return;
    nhsFlags = await r.json(); store.set("nhsflags", nhsFlags); render();
  }catch(e){}
}
async function loadReedDetails(){
  const ids = allJobs().filter(j => j.source === "Reed" && !j.detailed).map(j => j.id);
  const byId = Object.fromEntries((feed?.jobs || []).map(j => [j.id, j]));
  for (let i = 0; i < ids.length; i += 40){
    try{
      const r = await fetch(FEED_URL.replace(/\/jobs$/, "/reed-details") + "?ids=" + ids.slice(i, i+40).join(","));
      if (!r.ok) continue;
      const d = await r.json();
      for (const [id, x] of Object.entries(d)){
        const j = byId[id]; if (!j) continue;
        if (x.description) j.description = x.description;
        const hours = [x.fullTime && "full time", x.partTime && "part time"].filter(Boolean).join(" or ");
        if (x.contractType) j.type = x.contractType + (hours ? ", " + hours : "");
        if (x.salary) j.salary = x.salary;
        j.detailed = true;
      }
      render();
    }catch(e){}
  }
}

function rowHTML(j){
  const d = daysLeft(j.closeDate);
  const close = d === null ? "" : (d < 3 ? `<span class="closing">closes in ${d} day${d===1?"":"s"}</span>` : `closes ${fmtDate(j.closeDate)}`);
  const miles = j.miles == null ? "" : `${j.miles} mi`;
  const breaks = ruleBreaks(j);
  return `<div class="row ${read[j.id]?"":"unread"}" data-id="${esc(j.id)}">
    <button class="star ${stars[j.id]?"on":""}" data-star="${esc(j.id)}" aria-label="Save job"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="${stars[j.id]?"M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.4 14l-1.6 7z":"M22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.4 14l-1.6 7L12 17.3l6.2 3.7-1.6-7L22 9.2zM12 15.4l-3.8 2.3 1-4.3-3.3-2.9 4.4-.4L12 6.1l1.7 4 4.4.4-3.3 2.9 1 4.3-3.8-2.3z"}"/></svg></button>
    <div class="emp">${esc(j.employer)}</div>
    <div class="ttl">${esc(j.title)} <span>– ${esc(fmtSal(j.salary)||"salary not stated")} · ${esc((j.locations||[])[0]||"")}</span>${breaks.map(b=>`<span class="flag">${esc(b)}</span>`).join("")}${notes[j.id]?'<span class="tag">note</span>':""}${warnings(j).map(w=>`<span class="warn">${esc(w)}</span>`).join("")}</div>
    <div class="meta">${[miles, close].filter(Boolean).join(" · ")}</div>
  </div>${openId===j.id? detailHTML(j):""}`;
}
function detailHTML(j){
  const d = daysLeft(j.closeDate);
  const breaks = ruleBreaks(j);
  return `<div class="detail">
    <h2>${esc(j.title)}</h2>
    <div class="small">${esc(j.employer)} · ${esc(j.source)}</div>
    <dl class="facts">
      <dt>Location</dt><dd>${esc((j.locations||[]).join("; ")||"not stated")}</dd>
      <dt>Distance</dt><dd>${j.miles==null?"not stated":j.miles+" miles (straight line from home"+((j.milesApprox||j.static)?" to the town centre":"")+"; bus/train journey is longer)"}</dd>
      <dt>Salary</dt><dd>${esc(fmtSal(j.salary)||"not stated")}${/^£\d+(\.\d+)?$/.test(j.salary)&&+j.salary.slice(1)>=100&&+j.salary.slice(1)<5000?" (period not stated in advert)":""}</dd>
      <dt>Contract</dt><dd>${esc(j.type||"not stated")}</dd>
      <dt>Closing date</dt><dd>${j.closeDate? fmtDate(j.closeDate)+(d<3?` <span class="closing">(${d} day${d===1?"":"s"} left)</span>`:` (${d} days left)`):"not stated"}</dd>
      <dt>Posted</dt><dd>${fmtDate(j.postDate)}</dd>
      <dt>Source</dt><dd>${esc(j.source)}${j.static?" – saved list from 13 Nov 2026 (live Reed search unavailable)":""}${j.source==="Reed"&&!j.static&&!j.detailed?" – full advert not loaded yet; pay under £100 shown as per hour":""}${j.source==="Reed"&&j.detailed?" – full advert checked for driving requirements":""}${j.source==="NHS Jobs"?" – NHS Jobs only shares the advert's opening lines, so check the person specification on the advert before applying":""}</dd>
      ${breaks.length?`<dt>Breaks your rules</dt><dd class="closing">${breaks.map(esc).join(", ")}</dd>`:""}
    </dl>
    ${j.description?`<p class="desc">${esc(j.description.length>1200?j.description.slice(0,1200)+"…":j.description)}</p>`:""}
    ${j.note?`<p class="desc"><b>Note:</b> ${esc(j.note)}</p>`:""}
    ${warnings(j).length?`<p class="warnbox">${warnings(j).map(esc).join("<br>")}<br><span class="small">NHS Jobs only lets the app see that the word appears, not the sentence. Open the advert to check.</span></p>`:""}
    <a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Apply ↗</a>
    <div class="hiders"><button class="chip" data-hide="${esc(j.id)}" data-why="Needs a driving licence">Needs licence – hide</button><button class="chip" data-hide="${esc(j.id)}" data-why="Needs Level 3">Needs Level 3 – hide</button><button class="chip" data-hide="${esc(j.id)}" data-why="Not suitable">Not suitable – hide</button></div>
    <label class="notelabel" for="n-${esc(j.id)}">Application notes</label>
    <textarea id="n-${esc(j.id)}" data-note="${esc(j.id)}" placeholder="e.g. applied 14 Nov, interview date, contact name">${esc(notes[j.id]||"")}</textarea>
  </div>`;
}

function filtered(jobs){
  const term = q.trim().toLowerCase();
  return jobs.filter(j => {
    if (term && !(j.title+" "+j.employer+" "+(j.locations||[]).join(" ")+" "+(j.description||"")).toLowerCase().includes(term)) return false;
    if (filt.dist !== "any" && j.miles != null && j.miles > +filt.dist && +filt.dist < RADIUS) return false;
    if (+filt.sal > 0){ const a = annual(j.salary); if (a !== null && a < +filt.sal) return false; }
    if (filt.contract !== "all" && contractOf(j) !== filt.contract) return false;
    if (filt.soon){ const d = daysLeft(j.closeDate); if (d === null || d > 7) return false; }
    return true;
  });
}

function statusLine(){
  const when = feed ? new Date(feed.fetched) : (SNAPSHOT ? new Date(SNAPSHOT.fetched) : null);
  const dstr = when ? when.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"}) + " " + when.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}) : "";
  if (feedState === "loading") return `Checking NHS Jobs for new adverts… Showing jobs found on <b>${esc(dstr)}</b> meanwhile.`;
  if (feedState === "live"){ const sr = feed.sources || {}; return `Jobs found on <b>${esc(dstr)}</b> · live from NHS Jobs (${sr.nhs?.count ?? feed.count} adverts) and Reed (${sr.reed?.count ?? 0} adverts) within ${RADIUS} miles; care roles shown.${sr.reed?.error?" Reed not reached: "+esc(sr.reed.error)+".":""}`; }
  return `Jobs found on <b>${esc(dstr)}</b> · NHS Jobs could not be reached now (${esc(feedError)}); showing the last saved list. <button class="chip" id="retry">Try again</button>`;
}

function viewJobs(saved){
  const jobs = allJobs();
  let list = saved ? jobs.filter(j => stars[j.id]) : jobs;
  list = filtered(list);
  const sortBy = filt.sort || "new";
  const big = 1e9, cmp = {
    new: (a,b) => (b.postDate||"").localeCompare(a.postDate||""),
    near: (a,b) => (a.miles ?? big) - (b.miles ?? big),
    closing: (a,b) => (daysLeft(a.closeDate) ?? big) - (daysLeft(b.closeDate) ?? big),
    pay: (a,b) => (annual(b.salary) ?? -1) - (annual(a.salary) ?? -1),
  }[sortBy];
  list = [...list].sort(cmp);
  const main = list; // everything in one list; rule labels shown on each row, she hides as she goes
  const contracts = [...new Set(jobs.map(contractOf))].sort();
  return `<div class="bar">
    <h1>${saved?"Saved":"Jobs"}</h1>
    <select id="f-sort" aria-label="Sort"><option value="new">Newest first</option><option value="near">Nearest first</option><option value="closing">Closing soonest</option><option value="pay">Highest pay</option></select>
    ${saved?"":`<select id="f-dist" aria-label="Distance"><option value="15">Within 15 miles</option><option value="10">Within 10 miles</option><option value="5">Within 5 miles</option><option value="3">Within 3 miles</option><option value="any">Any distance</option></select>
    <select id="f-sal" aria-label="Salary"><option value="0">Any salary</option><option value="${NMW_YEAR}">Above minimum wage (${money(NMW_YEAR)})</option><option value="25500">£25,500+</option><option value="27000">£27,000+</option><option value="30000">£30,000+</option></select>
    <select id="f-con" aria-label="Contract"><option value="all">All contracts</option>${contracts.map(c=>`<option>${esc(c)}</option>`).join("")}</select>
    <button class="chip ${filt.soon?"on":""}" id="f-soon">Closing within 7 days</button>`}
    <div class="status">${statusLine()}</div>
  </div>
  ${main.length? main.map(rowHTML).join("") : `<div class="empty">${saved?"No saved jobs. Tap the star on a job to save it.":"No jobs match these filters."}</div>`}
  ${(() => { const ids = Object.keys(hidden); if (!ids.length || saved) return ""; return `<details class="other"><summary>Hidden jobs (${ids.length}) – hidden by you</summary>${ids.map(id => `<div class="pad small">${esc(hidden[id].title||id)} · ${esc(hidden[id].employer||"")} – <b>${esc(hidden[id].why)}</b> <button class="chip" data-unhide="${esc(id)}">Show again</button></div>`).join("")}</details>`; })()}
  <p class="small pad">Salary filter: hourly rates converted at 37.5 h/week. Pay per shift or unclear pay is never filtered out, and goes last when sorting by pay. Jobs with no distance go last when sorting by nearest. Distances are straight-line from home.</p>`;
}

function viewCareers(){
  const max = 40000, min = 18000, pos = v => Math.max(0, Math.min(100, (v-min)/(max-min)*100));
  return `<div class="bar"><h1>Career options</h1><div class="status">${CAREERS.length} roles your experience leads to. Bars: pay range; black line = full-time minimum wage ${money(NMW_YEAR)} (£${NMW_HOURLY}/h × 37.5 h). Your current pay varies, so minimum wage is the comparison.</div></div>
  <div class="cards">${CAREERS.map(c => `<div class="card">
    <h3>${esc(c.role)}${c.flag?`<span class="flag">${esc(c.flag)}</span>`:""}</h3>
    <div class="paybar" title="${esc(c.payText)}"><div class="range" style="left:${pos(c.pay[0])}%;width:${Math.max(1.5,pos(Math.min(c.pay[1],max))-pos(c.pay[0]))}%"></div><div class="nmw" style="left:${pos(NMW_YEAR)}%"></div></div>
    <div class="paylabels"><span>${money(min)}</span><span>${c.pay[1]>max?money(max)+"+":money(max)}</span></div>
    <p><b>Pay:</b> ${esc(c.payText)}</p>
    <p><b>Getting in:</b> ${esc(c.how)}</p>
    <p><b>Your skills it uses:</b> ${esc(c.skills)}</p>
    <p><a href="${esc(c.src)}" target="_blank" rel="noopener">Source</a> · <a href="https://www.jobs.nhs.uk/candidate/search/results?keyword=${encodeURIComponent(c.kw)}&location=Lewes&distance=15" target="_blank" rel="noopener">Live jobs on NHS Jobs</a> · <a href="https://www.reed.co.uk/jobs/${encodeURIComponent(c.kw.replace(/\s+/g,"-"))}-jobs-in-lewes?proximity=15" target="_blank" rel="noopener">Reed</a></p>
  </div>`).join("")}</div>
  <p class="small pad">NHS pay: Agenda for Change 2026/27, England (NHS Employers). Minimum wage: £12.71/h from 1 April 2026 (gov.uk).</p>`;
}

const sel = id => { const v = answers[id]; return Array.isArray(v) ? v : (v ? [v] : []); };
const maxOf = id => sel(id).length ? Math.max(...sel(id).map(Number)) : null;
function score(c){
  const a = c.a, reasons = []; let s = 0;
  const set = sel("set"); if (set.length && !set.includes("any")){ if (set.includes(a.set)){ s+=3; reasons.push("setting you chose"); } else if (a.set === "mixed"){ s+=1; } else s-=1; }
  const care = sel("care").map(Number); if (care.length){ const diff = Math.min(...care.map(v => Math.abs(v - a.care))); s += 2 - diff; if (diff===0) reasons.push("matches how much personal care you want"); }
  const clin = maxOf("clin"); if (clin!==null){ if (clin===0 && a.clin>=2){ s-=4; } else if (clin>=2 && a.clin>=2){ s+=2; reasons.push("clinical tasks"); } }
  const study = maxOf("study"); if (study!==null){ if (a.study > study+0.5){ s -= 3*(a.study - study); } else if (study>=3 && a.study>=2){ s+=1; reasons.push("training leads to a qualification"); } }
  const maths = maxOf("maths"); if (maths!==null){ if (a.maths && maths===0){ s-=4; } else if (a.maths && maths>0) reasons.push("needs Maths Level 2, which you'd take"); }
  const prio = sel("prio");
  if (prio.includes("pay")){ s += (c.pay[1]-25000)/3000; if (c.pay[1]>=29000) reasons.push("higher pay ceiling"); }
  if (prio.includes("prog")){ s += a.prog; if (a.prog>=3) reasons.push("clear progression route"); }
  if (prio.includes("hours") && !a.night){ s+=2; reasons.push("mostly daytime hours"); }
  if (prio.includes("stable") && (a.set==="hospital"||a.set==="mixed")){ s+=1; reasons.push("NHS contract"); }
  const night = maxOf("night"); if (night===0 && a.night){ s-=2; }
  const phys = maxOf("phys"); if (phys===0 && a.phys>=2){ s-=2; } else if (phys===0 && a.phys===0) reasons.push("lighter physical work");
  const people = sel("people"); if (people.length && !people.includes("any")){ if (people.includes(a.people)){ s+=2; reasons.push("works with the people you chose"); } else if (a.people!=="any") s-=1; }
  if (sel("team").includes(a.team)){ s+=1; reasons.push("team size you prefer"); }
  const clean = maxOf("clean"); if (clean!==null){ if (clean===0 && a.clean>=2) s-=4; else if (clean===2 && a.clean>=2) s+=1; }
  if (c.flag && /driving/i.test(c.flag)) s-=1.5;
  return {c, s, reasons};
}
function viewQuestions(){
  const answered = QUESTIONS.filter(x => x.free ? answers[x.id] : sel(x.id).length).length;
  return `<div class="bar"><h1>Questions</h1><button class="btn" id="match">Match</button><button class="btn ghost" id="dl">Download answers (.txt)</button><div class="status">${answered} of ${QUESTIONS.length} answered · tick as many answers as apply · saved automatically on this phone.</div></div>
  <div id="matchout"></div>
  ${QUESTIONS.map((x,i) => `<div class="q"><div class="qt">${i+1}. ${esc(x.t)}</div>${x.free
    ? `<textarea data-ans="${x.id}">${esc(answers[x.id]||"")}</textarea>`
    : x.o.map(([v,l]) => `<label class="opt"><input type="checkbox" name="${x.id}" value="${esc(v)}" data-ans="${x.id}" ${sel(x.id).includes(v)?"checked":""}> ${esc(l)}</label>`).join("")}</div>`).join("")}`;
}
function showMatch(){
  const res = CAREERS.map(score).sort((a,b)=>b.s-a.s).slice(0,6);
  const n = QUESTIONS.filter(x=>!x.free && sel(x.id).length).length;
  $("#matchout").innerHTML = `<div class="match"><b>Top 6 career options</b> (based on ${n} of 11 multiple-choice answers)<ol>${res.map(r=>`<li><b>${esc(r.c.role)}</b> – ${esc(r.c.payText)}<br><span class="small">${r.reasons.length? "Why: "+esc([...new Set(r.reasons)].join("; ")) : "Fewest clashes with your answers."}${r.c.flag?" · Note: "+esc(r.c.flag):""}</span></li>`).join("")}</ol></div>`;
  $("#matchout").scrollIntoView({behavior:"smooth"});
}
function downloadAnswers(){
  const lines = ["Care Jobs – answers", "Saved " + new Date().toLocaleString("en-GB"), ""];
  QUESTIONS.forEach((x,i) => {
    let v = answers[x.id] || "";
    if (!x.free){ v = sel(x.id).map(val => (x.o.find(o=>o[0]===val)||[,""])[1]).filter(Boolean).join("; "); }
    lines.push(`${i+1}. ${x.t}`, "   " + (v || "(not answered)"), "");
  });
  const blob = new Blob([lines.join("\n")], {type:"text/plain"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "care-jobs-answers.txt";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function viewSites(){
  return `<div class="bar"><h1>Job sites</h1><div class="status">Best places for care and hospital work near Lewes. Alert steps given only where checked.</div></div>
  ${SITES.map(s => `<div class="site"><h3><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)} ↗</a></h3><p>${esc(s.note)}</p><p><b>Email alerts:</b> ${esc(s.alerts)}${s.alertsSrc?` <a href="${esc(s.alertsSrc)}" target="_blank" rel="noopener">(NHSBSA guide)</a>`:""}</p></div>`).join("")}`;
}
function viewNotes(){
  const jobs = allJobs(); const byId = Object.fromEntries(jobs.map(j=>[j.id,j]));
  const ids = Object.keys(notes).filter(k => notes[k]);
  return `<div class="bar"><h1>Notes</h1><div class="status">Every job has a notes box (open a job in Jobs). Jobs with notes are listed here.</div></div>
  ${ids.length ? ids.map(id => byId[id] ? rowHTML(byId[id]) : `<div class="pad"><b>${esc(id)}</b> (advert no longer listed)<br><span class="small">${esc(notes[id])}</span></div>`).join("") : `<div class="empty">No notes yet.</div>`}`;
}

function render(){
  const jobs = allJobs();
  renderNav(jobs);
  const m = $("#main");
  const top = m.scrollTop;
  m.innerHTML = view==="jobs"? viewJobs(false) : view==="saved"? viewJobs(true) : view==="careers"? viewCareers() : view==="questions"? viewQuestions() : view==="sites"? viewSites() : viewNotes();
  if (view==="jobs"||view==="saved") $("#f-sort").value = filt.sort || "new";
  if (view==="jobs"){ $("#f-dist").value = filt.dist; $("#f-sal").value = filt.sal; $("#f-con").value = filt.contract; }
  m.scrollTop = top;
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const nav = e.target.closest("nav button");
  if (nav){ view = nav.dataset.v; store.set("view", view); openId = null; $("#main").scrollTop = 0; render(); return; }
  const st = e.target.closest("[data-star]");
  if (st){ e.stopPropagation(); const id = st.dataset.star; stars[id] = !stars[id]; if(!stars[id]) delete stars[id]; store.set("stars", stars); render(); return; }
  const hb = e.target.closest("[data-hide]");
  if (hb){ const j = allJobs().find(x => x.id === hb.dataset.hide); hidden[hb.dataset.hide] = {why: hb.dataset.why, title: j?.title||"", employer: j?.employer||""}; store.set("hidden", hidden); openId = null; render(); return; }
  const ub = e.target.closest("[data-unhide]");
  if (ub){ delete hidden[ub.dataset.unhide]; store.set("hidden", hidden); render(); return; }
  if (e.target.closest(".detail")) return;
  const row = e.target.closest(".row");
  if (row){ const id = row.dataset.id; openId = openId===id? null : id; read[id] = true; store.set("read", read); render(); return; }
  if (e.target.id==="f-soon"){ filt.soon = !filt.soon; store.set("filters", filt); render(); }
  if (e.target.id==="retry") loadFeed();
  if (e.target.id==="match") showMatch();
  if (e.target.id==="dl") downloadAnswers();
});
document.addEventListener("toggle", e => { if (e.target.matches?.("details.other")) store.set("otherOpen", e.target.open); }, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id==="f-sort"){ filt.sort = t.value; } else if (t.id==="f-dist"){ filt.dist = t.value; } else if (t.id==="f-sal"){ filt.sal = t.value; } else if (t.id==="f-con"){ filt.contract = t.value; }
  else if (t.dataset.ans && t.type==="checkbox"){ const id = t.dataset.ans; answers[id] = [...document.querySelectorAll(`input[type=checkbox][data-ans="${id}"]:checked`)].map(x => x.value); store.set("answers", answers); return; }
  else return;
  store.set("filters", filt); render();
});
let noteTimer;
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.note){ notes[t.dataset.note] = t.value; if(!t.value) delete notes[t.dataset.note]; clearTimeout(noteTimer); noteTimer = setTimeout(()=>{ store.set("notes", notes); renderNav(allJobs()); }, 300); }
  if (t.dataset.ans){ answers[t.dataset.ans] = t.value; store.set("answers", answers); }
});
let qTimer;
$("#q").addEventListener("input", e => { q = e.target.value; clearTimeout(qTimer); qTimer = setTimeout(()=>{ if (view!=="jobs" && view!=="saved"){ view="jobs"; } render(); }, 150); });

render();
loadFeed();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && feed && Date.now() - new Date(feed.fetched) > 30*60*1000) loadFeed(); });
if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(()=>{}); } catch(e){} }
</script>
</body>
</html>
